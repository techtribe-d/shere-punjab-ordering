<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shere Punjab | Kitchen</title>

<style>

:root{
  --maroon:#6e1820;
  --deep:#260d0d;
  --gold:#d9a441;
  --cream:#fff8eb;
  --ink:#2a1a16;
  --muted:#715e56;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:Arial,sans-serif;
}

header{
  background:var(--deep);
  color:white;
  padding:25px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  margin:0;
  font-family:Georgia,serif;
}

.badge{
  background:var(--gold);
  color:var(--deep);
  padding:10px 18px;
  border-radius:30px;
  font-weight:bold;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.info{
  background:white;
  padding:22px;
  border-radius:20px;
  border:1px solid #ead7bb;
  margin-bottom:25px;
}

.info h2{
  color:var(--maroon);
  margin-top:0;
}

.info p{
  color:var(--muted);
}

.orders{
  display:grid;
  gap:20px;
}

.order{
  background:white;
  border:1px solid #ead7bb;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 25px #4d251414;
}

.order-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  padding-bottom:15px;
  border-bottom:2px solid #ead7bb;
}

.order-number{
  color:var(--maroon);
  font-size:1.9rem;
  font-weight:bold;
}

.table{
  background:var(--cream);
  color:var(--maroon);
  padding:10px 16px;
  border-radius:30px;
  font-weight:bold;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px dashed #d9c3a7;
}

.total{
  text-align:right;
  color:var(--maroon);
  font-size:1.25rem;
  font-weight:bold;
  margin-top:18px;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#fff8eb;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

button{
  border:0;
  padding:13px 20px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
}

.start{
  background:var(--gold);
  color:var(--deep);
}

.ready{
  background:#2f6b3a;
  color:white;
}

.delivered{
  background:var(--maroon);
  color:white;
}

.empty{
  background:white;
  padding:50px 20px;
  text-align:center;
  border-radius:20px;
  color:var(--muted);
}

@media(max-width:600px){

  header{
    flex-direction:column;
    gap:15px;
    text-align:center;
  }

  .item{
    gap:15px;
  }

}

</style>

</head>


<body>


<header>

<h1>
Shere Punjab Restaurant
</h1>

<div class="badge">
👨‍🍳 KITCHEN
</div>

</header>


<div class="container">


<div class="info">

<h2>
🍳 Kitchen Orders
</h2>

<p>
Orders sent from the counter will appear here.
Prepare the food and mark the order as ready.
</p>

</div>


<div
id="orders"
class="orders"
>

<div class="empty">

<h2>
Waiting for orders...
</h2>

<p>
Orders will appear automatically.
</p>

</div>

</div>


</div>


<script type="module">


/* FIREBASE */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getFirestore,
  collection,
  onSnapshot,
  query,
  orderBy,
  doc,
  updateDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyCkcNYnZdMXa0Zbg5YGOLB-e1pDRXCPQxg",

  authDomain:
  "shere-punjab-ordering.firebaseapp.com",

  projectId:
  "shere-punjab-ordering",

  storageBucket:
  "shere-punjab-ordering.firebasestorage.app",

  messagingSenderId:
  "930249634762",

  appId:
  "1:930249634762:web:cea7dd0848bd39e9a3d533"

};


/* INITIALIZE */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* ORDERS */

const ordersRef =
collection(db,"orders");


const ordersQuery =
query(
  ordersRef,
  orderBy("createdAt","desc")
);


/* LIVE ORDERS */

onSnapshot(
  ordersQuery,

  function(snapshot){

    const container =
      document.getElementById("orders");


    let foundOrders = false;

    container.innerHTML = "";


    snapshot.forEach(function(docSnap){

      const order =
        docSnap.data();


      const id =
        docSnap.id;


      /*
       Only show orders that
       have been sent to kitchen.
      */

      if(
        order.status !== "preparing" &&
        order.status !== "ready"
      ){

        return;

      }


      foundOrders = true;


      let itemsHTML = "";


      order.items.forEach(function(item){

        itemsHTML += `

          <div class="item">

            <span>

              <strong>
                ${item.quantity} ×
              </strong>

              ${item.name}

            </span>

            <strong>
              ₹${item.price * item.quantity}
            </strong>

          </div>

        `;

      });


      let statusText =
        "🍳 Preparing";


      if(order.status === "ready"){

        statusText =
          "✅ READY FOR DELIVERY";

      }


      container.innerHTML += `

        <div class="order">

          <div class="order-head">

            <div>

              <div>
                ORDER NUMBER
              </div>

              <div class="order-number">

                ${order.orderNumber}

              </div>

            </div>


            <div class="table">

              🪑 Table ${order.tableNumber}

            </div>

          </div>


          <div style="margin-top:20px;">

            ${itemsHTML}

          </div>


          <div class="total">

            Total: ₹${order.total}

          </div>


          <div class="status">

            ${statusText}

          </div>


          <div class="buttons">

            ${
              order.status === "preparing"

              ?

              `

              <button
                class="ready"
                onclick="markReady('${id}')">

                ✅ FOOD READY

              </button>

              `

              :

              `

              <button
                class="delivered"
                onclick="markDelivered('${id}')">

                🍽️ DELIVERED TO TABLE

              </button>

              `

            }

          </div>

        </div>

      `;

    });


    if(!foundOrders){

      container.innerHTML = `

        <div class="empty">

          <h2>
            👨‍🍳 Kitchen is clear
          </h2>

          <p>
            Waiting for the next order...
          </p>

        </div>

      `;

    }

  },


  function(error){

    console.error(error);

    document.getElementById("orders").innerHTML = `

      <div class="empty">

        <h2>
          ⚠️ Unable to load orders
        </h2>

        <p>
          Check Firebase Firestore rules.
        </p>

      </div>

    `;

  }

);


/* MARK READY */

window.markReady =
async function(id){

  try{

    await updateDoc(
      doc(db,"orders",id),
      {
        status:"ready"
      }
    );

  }catch(error){

    console.error(error);

    alert(
      "Could not update order."
    );

  }

};


/* DELIVERED */

window.markDelivered =
async function(id){

  try{

    await updateDoc(
      doc(db,"orders",id),
      {
        status:"delivered"
      }
    );

  }catch(error){

    console.error(error);

    alert(
      "Could not update order."
    );

  }

};


</script>


</body>

</html>
