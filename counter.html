<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shere Punjab | Counter</title>

<style>

:root{
  --maroon:#6e1820;
  --deep:#260d0d;
  --gold:#d9a441;
  --cream:#fff8eb;
  --ink:#2a1a16;
  --muted:#715e56;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:Arial,sans-serif;
}

header{
  background:var(--deep);
  color:white;
  padding:25px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

header h1{
  margin:0;
  font-family:Georgia,serif;
}

.badge{
  background:var(--gold);
  color:var(--deep);
  padding:10px 18px;
  border-radius:30px;
  font-weight:bold;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.top{
  background:white;
  border:1px solid #ead7bb;
  border-radius:20px;
  padding:22px;
  margin-bottom:25px;
}

.top h2{
  color:var(--maroon);
  margin-top:0;
}

.top p{
  color:var(--muted);
}

.orders{
  display:grid;
  gap:20px;
}

.order{
  background:white;
  border:1px solid #ead7bb;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 25px #4d251414;
}

.order-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  border-bottom:2px solid #ead7bb;
  padding-bottom:15px;
}

.order-number{
  color:var(--maroon);
  font-size:1.8rem;
  font-weight:bold;
}

.table{
  background:var(--cream);
  color:var(--maroon);
  padding:10px 16px;
  border-radius:30px;
  font-weight:bold;
}

.item{
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px dashed #d9c3a7;
}

.total{
  text-align:right;
  color:var(--maroon);
  font-size:1.3rem;
  font-weight:bold;
  margin-top:18px;
}

.payment{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#fff8eb;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}

button{
  border:0;
  padding:13px 20px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
}

.accept{
  background:var(--gold);
  color:var(--deep);
}

.paid{
  background:#2f6b3a;
  color:white;
}

.kitchen{
  background:var(--maroon);
  color:white;
}

.empty{
  text-align:center;
  background:white;
  padding:50px 20px;
  border-radius:20px;
  color:var(--muted);
}

@media(max-width:600px){

  header{
    flex-direction:column;
    text-align:center;
  }

  .item{
    gap:15px;
  }

}

</style>

</head>

<body>


<header>

<h1>
Shere Punjab Restaurant
</h1>

<div class="badge">
COUNTER
</div>

</header>


<div class="container">


<div class="top">

<h2>
📋 Live Customer Orders
</h2>

<p>
Orders placed by customers will appear here automatically.
Customers pay at the counter before eating.
</p>

</div>


<div
id="orders"
class="orders"
>

<div class="empty">

<h2>
Waiting for orders...
</h2>

<p>
New customer orders will appear automatically.
</p>

</div>

</div>


</div>


<script type="module">


/* FIREBASE */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getFirestore,
  collection,
  onSnapshot,
  query,
  orderBy,
  doc,
  updateDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyCkcNYnZdMXa0Zbg5YGOLB-e1pDRXCPQxg",

  authDomain:
  "shere-punjab-ordering.firebaseapp.com",

  projectId:
  "shere-punjab-ordering",

  storageBucket:
  "shere-punjab-ordering.firebasestorage.app",

  messagingSenderId:
  "930249634762",

  appId:
  "1:930249634762:web:cea7dd0848bd39e9a3d533"

};


/* START FIREBASE */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* ORDERS */

const ordersRef =
collection(db,"orders");


const ordersQuery =
query(
  ordersRef,
  orderBy("createdAt","desc")
);


/* LIVE LISTENER */

onSnapshot(
  ordersQuery,
  function(snapshot){

    const container =
      document.getElementById("orders");


    if(snapshot.empty){

      container.innerHTML = `

        <div class="empty">

          <h2>
            Waiting for orders...
          </h2>

          <p>
            New customer orders will appear automatically.
          </p>

        </div>

      `;

      return;

    }


    container.innerHTML = "";


    snapshot.forEach(function(docSnap){

      const order =
        docSnap.data();


      const id =
        docSnap.id;


      let itemsHTML = "";


      order.items.forEach(function(item){

        const itemTotal =
          item.price * item.quantity;


        itemsHTML += `

          <div class="item">

            <span>

              ${item.name}

              × ${item.quantity}

            </span>

            <strong>

              ₹${itemTotal}

            </strong>

          </div>

        `;

      });


      let paymentText =
        "💰 Payment Pending";


      if(order.payment === "paid"){

        paymentText =
          "✅ Payment Received";

      }


      container.innerHTML += `

        <div class="order">

          <div class="order-head">

            <div>

              <div>
                ORDER NUMBER
              </div>

              <div class="order-number">

                ${order.orderNumber}

              </div>

            </div>


            <div class="table">

              🪑 Table ${order.tableNumber}

            </div>

          </div>


          <div style="margin-top:20px;">

            ${itemsHTML}

          </div>


          <div class="total">

            Total: ₹${order.total}

          </div>


          <div class="payment">

            ${paymentText}

          </div>


          <div class="buttons">

            <button
              class="accept"
              onclick="acceptOrder('${id}')">

              ✓ Accept Order

            </button>


            <button
              class="paid"
              onclick="markPaid('${id}')">

              💰 Payment Received

            </button>


            <button
              class="kitchen"
              onclick="sendKitchen('${id}')">

              👨‍🍳 Send to Kitchen

            </button>

          </div>

        </div>

      `;

    });

  },

  function(error){

    console.error(error);

    document.getElementById("orders").innerHTML = `

      <div class="empty">

        <h2>
          ⚠️ Unable to load orders
        </h2>

        <p>
          Check your Firebase connection and Firestore rules.
        </p>

      </div>

    `;

  }

);


/* ACCEPT */

window.acceptOrder =
async function(id){

  await updateDoc(
    doc(db,"orders",id),
    {
      status:"accepted"
    }
  );

};


/* PAYMENT */

window.markPaid =
async function(id){

  await updateDoc(
    doc(db,"orders",id),
    {
      payment:"paid"
    }
  );

};


/* SEND TO KITCHEN */

window.sendKitchen =
async function(id){

  await updateDoc(
    doc(db,"orders",id),
    {
      status:"preparing"
    }
  );

  alert(
    "Order sent to kitchen!"
  );

};


</script>


</body>

</html>
