<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shere Punjab Restaurant | Counter</title>

<style>

:root{
  --maroon:#6e1820;
  --deep:#260d0d;
  --gold:#d9a441;
  --cream:#fff8eb;
  --ink:#2a1a16;
  --muted:#715e56;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--cream);
  color:var(--ink);
}

/* HEADER */

header{
  background:var(--deep);
  color:white;
  padding:25px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

header h1{
  margin:0;
  font-family:Georgia,serif;
}

.status{
  background:#d9a441;
  color:#260d0d;
  padding:10px 18px;
  border-radius:30px;
  font-weight:bold;
}

/* MAIN */

.container{
  max-width:1200px;
  margin:auto;
  padding:35px 20px;
}

h2{
  color:var(--maroon);
}

/* INFO */

.info{
  background:white;
  border:1px solid #ead7bb;
  border-radius:18px;
  padding:20px;
  margin-bottom:25px;
}

.info p{
  color:var(--muted);
  line-height:1.6;
}

/* ORDERS */

.orders{
  display:grid;
  gap:20px;
}

.order-card{
  background:white;
  border:1px solid #ead7bb;
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 25px #4d251414;
}

.order-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  border-bottom:1px dashed #d9c3a7;
  padding-bottom:15px;
}

.order-number{
  font-size:1.8rem;
  font-weight:bold;
  color:var(--maroon);
}

.table-number{
  background:#fff8eb;
  color:var(--maroon);
  padding:9px 15px;
  border-radius:20px;
  font-weight:bold;
}

.order-items{
  margin:20px 0;
}

.order-item{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #f0e4d2;
}

.total{
  text-align:right;
  color:var(--maroon);
  font-size:1.2rem;
  font-weight:bold;
  margin-top:15px;
}

/* BUTTON */

button{
  border:0;
  padding:13px 20px;
  border-radius:30px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
}

.accept{
  background:var(--gold);
  color:var(--deep);
}

.ready{
  background:var(--maroon);
  color:white;
}

.paid{
  background:#2f6b3a;
  color:white;
}

button:hover{
  opacity:.85;
}

/* EMPTY */

.empty{
  text-align:center;
  background:white;
  border-radius:20px;
  padding:50px 20px;
  color:var(--muted);
}

/* MOBILE */

@media(max-width:600px){

  header{
    flex-direction:column;
    text-align:center;
  }

  .order-item{
    flex-direction:column;
    gap:5px;
  }

}

</style>

</head>

<body>

<header>

<h1>
Shere Punjab Restaurant
</h1>

<div class="status">
COUNTER
</div>

</header>


<div class="container">

<div class="info">

<h2>
📋 Counter Orders
</h2>

<p>
Orders placed by customers will appear here.
The customer pays at the counter before eating.
</p>

</div>


<div id="orders" class="orders">

<div class="empty">

<h2>
No orders yet
</h2>

<p>
Waiting for customer orders...
</p>

</div>

</div>

</div>


<script>

/*
  TEMPORARY COUNTER SYSTEM

  This page currently demonstrates
  the counter interface.

  In the next step we will connect
  customer.html and counter.html
  using a server.
*/


let demoOrders = [

{
  number:"SP1024",
  table:"12",

  items:[
    {
      name:"Samosa",
      price:40
    },
    {
      name:"Kachori",
      price:40
    },
    {
      name:"Kaju Katli 1 kg",
      price:1000
    }
  ],

  total:1080
},

{
  number:"SP5831",
  table:"7",

  items:[
    {
      name:"Samosa Half",
      price:25
    },
    {
      name:"Santra Barfi 1 kg",
      price:700
    }
  ],

  total:725
}

];


function displayOrders(){

  const container =
    document.getElementById("orders");


  if(demoOrders.length === 0){

    container.innerHTML = `

      <div class="empty">

        <h2>No orders yet</h2>

        <p>
        Waiting for customer orders...
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  demoOrders.forEach(function(order){

    let itemsHTML = "";


    order.items.forEach(function(item){

      itemsHTML += `

        <div class="order-item">

          <span>
            ${item.name}
          </span>

          <strong>
            ₹${item.price}
          </strong>

        </div>

      `;

    });


    container.innerHTML += `

      <div class="order-card">

        <div class="order-header">

          <div>

            <div>
              ORDER
            </div>

            <div class="order-number">
              ${order.number}
            </div>

          </div>

          <div class="table-number">
            🪑 Table ${order.table}
          </div>

        </div>


        <div class="order-items">

          ${itemsHTML}

        </div>


        <div class="total">

          Total:
          ₹${order.total}

        </div>


        <br>


        <button
          class="accept"
          onclick="acceptOrder('${order.number}')">

          Accept Order

        </button>


        <button
          class="ready"
          onclick="readyOrder('${order.number}')">

          Mark Ready

        </button>


        <button
          class="paid"
          onclick="paidOrder('${order.number}')">

          Payment Received

        </button>

      </div>

    `;

  });

}


function acceptOrder(number){

  alert(
    "Order " +
    number +
    " accepted."
  );

}


function readyOrder(number){

  alert(
    "Order " +
    number +
    " is ready for delivery to the table."
  );

}


function paidOrder(number){

  alert(
    "Payment received for order " +
    number +
    "."
  );

}


displayOrders();

</script>

</body>
</html>
